<div class="reward-overlay">
  <div class="reward-card">
    <div class="reward-icon">🏆</div>

    <h2>🎉 مبروك!</h2>

    <p class="reward-title">
      {{ reward.title }}
    </p>

    <p class="reward-description">
      {{ reward.description }}
    </p>

    <div class="reward-points">
      +{{ reward.points }}

      <span>نقطة معرفة</span>
    </div>

    <button class="btn btn-warning btn-lg w-100 mt-4" (click)="onClaim()" [disabled]="loading">
      @if (loading) {
        <span class="spinner-border spinner-border-sm ms-2"></span>

        جاري استلام المكافأة...
      } @else {
        استلام المكافأة
      }
    </button>

    <button class="btn btn-link text-secondary w-100 mt-2" (click)="onClose()">لاحقًا</button>
  </div>
</div>
