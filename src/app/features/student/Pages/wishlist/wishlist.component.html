<div class="wishlist-page" dir="rtl">
  <div class="wishlist-header">
    <h1 class="wishlist-title">
      <i class="bi bi-heart-fill" style="color: var(--primary);"></i>
      مفضلتي
    </h1>
    <span class="wishlist-count">{{ wishlistItems().length }} دورة</span>
  </div>

  @if (isLoading()) {
  <div class="loading-state">
    <div class="spinner"></div>
    <p>جارِ التحميل...</p>
  </div>
  } @else if (wishlistItems().length === 0) {
  <div class="empty-state">
    <i class="bi bi-heart"></i>
    <h2>قائمة المفضلة فارغة</h2>
    <p>أضف دورات تعجبك لتجدها هنا بسهولة</p>
    <a routerLink="../courses" class="browse-btn">تصفح الدورات</a>
  </div>
  } @else {
  <div class="wishlist-grid">
