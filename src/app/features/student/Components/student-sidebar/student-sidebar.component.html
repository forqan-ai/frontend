<div
  class="d-none d-lg-flex flex-column vh-100 position-fixed end-0 top-0 student-sidebar"
>
  <div class="p-3 border-bottom-side text-center position-relative student-sidebar-header">
    <app-notification-bell
      class="student-notification-bell"
      theme="dark"
      menuAlign="start"
    ></app-notification-bell>

    <div class="d-flex flex-column align-items-center gap-2">
      <app-avatar
        [border]="true"
        [size]="70"
        src="{{ user()?.profileImageURL ?? 'images/avatar.webp' }}"
      ></app-avatar>

      <div>
        <div class="text-white fw-semibold">
          {{ user()?.fullName }}
        </div>

        <div class="text-white-50" style="font-size: 12px">
          {{ user()?.email }}
        </div>
      </div>
    </div>
  </div>

  <nav class="grow p-3 student-nav">
    <div class="d-flex flex-column gap-2">
      <a
        routerLink="home"
        (click)="setActiveRoute('home')"
        [class.secondary-white-anchor]="isActive('home')"
        [class.white-anchor]="!isActive('home')"
        style="--nav-index: 0"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-grid-1x2-fill"></i>
        الرئيسية
      </a>

      <a
        routerLink="my-courses"
        (click)="setActiveRoute('my-courses')"
        [class.secondary-white-anchor]="isActive('my-courses')"
        [class.white-anchor]="!isActive('my-courses')"
        style="--nav-index: 1"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-book"></i>
        دوراتي
      </a>

      <a
        routerLink="learning-circles"
        (click)="setActiveRoute('learning-circles')"
        [class.secondary-white-anchor]="isActive('learning-circles')"
        [class.white-anchor]="!isActive('learning-circles')"
        style="--nav-index: 2"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-bounding-box-circles"></i>
        حلقات العلم
      </a>

      <a
        routerLink="consultations"
        (click)="setActiveRoute('consultations')"
        [class.secondary-white-anchor]="isActive('consultations')"
        [class.white-anchor]="!isActive('consultations')"
        style="--nav-index: 3"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-chat-dots"></i>
        الاستشارات
      </a>

      <a
        routerLink="teachers"
        (click)="setActiveRoute('teachers')"
        [class.secondary-white-anchor]="isActive('teachers')"
        [class.white-anchor]="!isActive('teachers')"
        style="--nav-index: 4"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <span class="material-symbols-outlined">groups</span>
        المعلمون
      </a>

      <a
        routerLink="courses"
        (click)="setActiveRoute('courses')"
        [class.secondary-white-anchor]="isActive('courses')"
        [class.white-anchor]="!isActive('courses')"
        style="--nav-index: 5"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-collection-play"></i>
        الدورات
      </a>

      <a
        routerLink="wishlist"
        (click)="setActiveRoute('wishlist')"
        [class.secondary-white-anchor]="isActive('wishlist')"
        [class.white-anchor]="!isActive('wishlist')"
        style="--nav-index: 6"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-heart"></i>
        مفضلتي
      </a>

      <a
        routerLink="placement-test"
        (click)="setActiveRoute('placement-test')"
        [class.secondary-white-anchor]="isActive('placement-test')"
        [class.white-anchor]="!isActive('placement-test')"
        style="--nav-index: 7"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-signpost-split"></i>
        مساري التعليمي
      </a>

      <a
        routerLink="settings"
        (click)="setActiveRoute('settings')"
        [class.secondary-white-anchor]="isActive('settings')"
        [class.white-anchor]="!isActive('settings')"
        style="--nav-index: 8"
        class="d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
      >
        <i class="bi bi-person-gear"></i>
        إدارة حسابك
      </a>
    </div>
  </nav>

  <div class="p-3 border-top-side d-flex flex-column gap-2 student-sidebar-footer">
    @if (this.authService.getRole() === 'Teacher') {
      <a
        routerLink="/teacher"
        (click)="setActiveRoute('teacher')"
        class="role-switch-btn text-decoration-none"
      >
        <span class="role-switch-icon">
          <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
        </span>

        لوحة المعلم

        <i
          class="bi bi-arrow-left role-switch-arrow"
          aria-hidden="true"
        ></i>
      </a>
    }

    <a
      (click)="logout()"
      class="logout-btn"
      role="button"
      tabindex="0"
    >
      <span class="logout-icon">
        <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
      </span>

      تسجيل خروج
    </a>
  </div>
</div>
