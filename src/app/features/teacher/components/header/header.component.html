<header class="header" dir="rtl">
  <div class="header-left">
    <button class="menu-btn" type="button" (click)="menuClick.emit()" aria-label="فتح القائمة">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <div class="page-title">
      <span>لوحة المعلم</span>
      <h1>مرحبا بعودتك</h1>
      <p>تابع أداءك التعليمي وإدارة محتواك من مكان واحد.</p>
    </div>
  </div>

  <div class="header-actions">
    <app-notification-bell />

    <div class="teacher-info">
      <img [src]="image() || 'images/avatar.webp'" [alt]="teacherName() || 'صورة المعلم'" />

      <div>
        <h4>{{ teacherName() || 'معلم الفرقان' }}</h4>
        <span>معلم</span>
      </div>
    </div>
  </div>
</header>
