<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label> الاسم </label>

    <input formControlName="fullName" />
  </div>

  <div class="field">
    <label> البريد </label>

    <input [disabled]="true" formControlName="email" />
  </div>

  <div class="field">
    <label> نبذة </label>

    <textarea rows="6" formControlName="bio"> </textarea>
  </div>

  <button>حفظ التعديلات</button>
</form>
