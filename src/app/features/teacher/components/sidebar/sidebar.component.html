@if (opened()) {
  <div class="overlay" (click)="closeSidebar()"></div>
}

<aside class="sidebar" [class.open]="opened()" dir="rtl" aria-label="قائمة المعلم">
  <div class="brand">
    <div class="logo">
      <img src="images/logo.png" alt="منصة الفرقان" />
    </div>
    <span>مساحة المعلم</span>
  </div>

  <nav>
    @for (item of menu(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebar()"
      >
        <i [class]="'nav-icon ' + item.icon" aria-hidden="true"></i>
        <span class="nav-label">{{ item.title }}</span>
      </a>
    }
  </nav>


  <div class="sidebar-footer">
    <button class="role-switch-btn" type="button" (click)="goToStudent()">
      <span class="role-switch-icon"><i class="bi bi-arrow-repeat" aria-hidden="true"></i></span>
       لوحة الطالب
      <i class="bi bi-arrow-left role-switch-arrow" aria-hidden="true"></i>
    </button>
    <button (click)="logout()" class="logout" type="button">
      <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
      تسجيل خروج
    </button>
  </div>
</aside>
