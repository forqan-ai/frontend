<section class="statistics" dir="rtl" aria-label="إحصاءات المعلم">
  <article class="stat-card students">
    <i class="bi bi-people-fill" aria-hidden="true"></i>
    <div>
      <h2>{{ dashboard()?.totalStudents ?? 0 }}</h2>
      <p>الطلاب</p>
    </div>
  </article>

  <article class="stat-card courses">
    <i class="bi bi-journal-bookmark-fill" aria-hidden="true"></i>
    <div>
      <h2>{{ dashboard()?.totalCourses ?? 0 }}</h2>
      <p>الدورات</p>
    </div>
  </article>

  <article class="stat-card rating">
    <i class="bi bi-star-fill" aria-hidden="true"></i>
    <div>
      <h2>{{ dashboard()?.rating ?? 0 }}</h2>
      <p>التقييم</p>
    </div>
  </article>

  <article class="stat-card circles">
    <i class="bi bi-chat-square-text-fill" aria-hidden="true"></i>
    <div>
      <h2>{{ dashboard()?.learningCirclesCount ?? 0 }}</h2>
      <p>حلقات العلم</p>
    </div>
  </article>
</section>
