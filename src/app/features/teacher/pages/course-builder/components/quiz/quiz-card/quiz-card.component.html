<div class="card border-primary mt-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-1">
        {{ quiz.title }}
      </h5>

      <small>
        {{ quiz.type == 0 ? 'Practice Quiz' : 'Final Quiz' }}

        |

        {{ quiz.timeLimitMin }} min | Passing {{ quiz.passingScore }}%
      </small>
    </div>

    <div>
      <button class="btn btn-warning btn-sm me-2" (click)="toggleEdit()">Edit</button>

      <button class="btn btn-danger btn-sm me-2" (click)="deleteQuiz()">Delete</button>

      <button class="btn btn-success btn-sm me-2" (click)="manageQuestions()">Questions</button>
    </div>
  </div>

  @if (showEdit()) {
    <div class="card-body">
      <app-edit-quiz-dialog
        [quiz]="quiz"
        [moduleId]="moduleId"
        (saved)="refresh.emit(); toggleEdit()"
      >
      </app-edit-quiz-dialog>
    </div>
  }
</div>
