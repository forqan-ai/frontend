<div class="card shadow-sm mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-0">
        {{ module.orderIndex }} -
        {{ module.title }}
      </h5>
    </div>

    <div>
      <button class="btn btn-sm btn-outline-success me-2" (click)="toggleAddLesson()">
        Add Lesson
      </button>
      <button class="btn btn-sm btn-outline-primary me-2" (click)="toggleAddQuiz()">
        Add Quiz
      </button>
      <button class="btn btn-outline-warning btn-sm me-2" (click)="toggleEdit()">Edit</button>

      <button class="btn btn-sm btn-outline-danger me-2" (click)="deleteModule()">Delete</button>
    </div>
  </div>

  <!-- Edit Module -->

  @if (showEdit()) {
    <div class="card-body border-bottom">
      <app-edit-module-dialog
        [module]="module"
        [courseId]="courseId"
        (saved)="refresh.emit(); toggleEdit()"
      >
      </app-edit-module-dialog>
    </div>
  }

  <!-- Add Lesson -->

  @if (showAddLesson()) {
    <div class="card-body border-bottom">
      <app-add-lesson-dialog
        [moduleId]="module.moduleID"
        (saved)="loadLessons(); toggleAddLesson()"
      >
      </app-add-lesson-dialog>
    </div>
  }

  <!-- Lessons -->

  <div class="card-body">
    @for (lesson of lessons(); track lesson.lessonID) {
      <app-lesson-card [lesson]="lesson" [moduleId]="module.moduleID" (refresh)="loadLessons()">
      </app-lesson-card>
    }
  </div>

  <hr />

  @if (showAddQuiz()) {
    <div class="card border-0">
      <app-add-quiz-dialog [moduleId]="module.moduleID" (saved)="loadQuiz(); toggleAddQuiz()">
      </app-add-quiz-dialog>
    </div>
  }

  @if (quiz()) {
    <app-quiz-card [quiz]="quiz()!" [moduleId]="module.moduleID" (refresh)="loadQuiz()">
    </app-quiz-card>
  }
</div>
