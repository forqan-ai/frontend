<div class="edit-option-form">

  <div class="form-header">
    <div class="form-icon">
      <i class="bi bi-pencil-square"></i>
    </div>

    <div>
      <span class="form-eyebrow">تعديل الاختيار</span>

      <h3>تعديل بيانات الاختيار</h3>

      <p>
        قم بتعديل نص الاختيار وتحديد ما إذا كان يمثل الإجابة الصحيحة.
      </p>
    </div>
  </div>


  <div class="form-body">

    <div class="form-group">

      <label for="optionText">
        نص الاختيار
        <span class="required">*</span>
      </label>

      <div
        class="input-wrapper"
        [class.input-error]="submitted && !optionText"
      >
        <i class="bi bi-chat-left-text input-icon"></i>

        <input
          id="optionText"
          type="text"
          class="form-control"
          [(ngModel)]="optionText"
          placeholder="اكتب نص الاختيار..."
          maxlength="500"
        />
      </div>

      @if (submitted && !optionText) {
        <div class="validation-message">
          <i class="bi bi-exclamation-circle"></i>

          <span>
            من فضلك أدخل نص الاختيار.
          </span>
        </div>
      }

    </div>


    <div class="correct-answer-box">

      <label class="correct-answer-label">

        <input
          type="checkbox"
          [(ngModel)]="isCorrect"
        />

        <span class="custom-checkbox">
          <i class="bi bi-check-lg"></i>
        </span>

        <span class="correct-content">
          <strong>الإجابة الصحيحة</strong>

          <small>
            حدد هذا الاختيار إذا كان يمثل الإجابة الصحيحة.
          </small>
        </span>

      </label>

    </div>


    <button
      type="button"
      class="save-button"
      [disabled]="isSaving"
      (click)="save()"
    >

      @if (isSaving) {
        <span class="save-spinner"></span>

        <span>
          جاري الحفظ...
        </span>
      } @else {
        <i class="bi bi-check2"></i>

        <span>
          حفظ التعديلات
        </span>
      }

    </button>

  </div>

</div>
