<div class="card shadow-sm mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      @if (option.isCorrect) {
        <span class="badge bg-success me-2"> Correct </span>
      }

      {{ option.optionText }}
    </div>

    <div>
      <button class="btn btn-warning btn-sm me-2" (click)="toggleEdit()">Edit</button>

      <button class="btn btn-danger btn-sm me-2" (click)="deleteOption()">Delete</button>
    </div>
  </div>

  @if (showEdit()) {
    <div class="card-body border-top">
      <app-edit-option-dialog [option]="option" (saved)="refresh.emit(); toggleEdit()">
      </app-edit-option-dialog>
    </div>
  }
</div>
