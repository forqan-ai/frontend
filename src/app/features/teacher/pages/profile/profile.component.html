<div class="dashboard">
  <div class="content">

    <div class="profile-grid">

      <app-profile-summary
        [teacher]="profile()"
        (imageSelected)="onImageSelected($event)"
      >
      </app-profile-summary>

      <app-profile-form
        [teacher]="profile()"
        (save)="updateProfile($event)"
      >
      </app-profile-form>

    </div>

    <app-profile-statistics
      [dashboard]="dashboard()"
    >
    </app-profile-statistics>

    <app-specialties-card
      [specialties]="specialties()"
      [selectedIds]="profile()?.specialtyIds ?? []"
      [teacherSpecialties]="profile()?.specialties ?? []"
      (save)="saveSpecialties($event)"
    >
    </app-specialties-card>

  </div>
</div>
