<div class="dashboard">
  <app-sidebar [opened]="sidebarOpen()" (close)="closeSidebar()"> </app-sidebar>

  <div class="content">
    <app-header
      [teacherName]="profile()?.fullName ?? ''"
      [image]="profile()?.profileImageURL ?? ''"
      (menuClick)="toggleSidebar()"
    >
    </app-header>

    <div class="profile-grid">
      <app-profile-summary [teacher]="profile()" (imageSelected)="onImageSelected($event)">
      </app-profile-summary>

      <app-profile-form [teacher]="profile()" (save)="updateProfile($event)"> </app-profile-form>
    </div>

    <app-specialties-card
      [specialties]="specialties()"
      [selectedIds]="profile()?.specialtyIds ?? []"
      [teacherSpecialties]="profile()?.specialties ?? []"
      (save)="saveSpecialties($event)"
    >
    </app-specialties-card>
    <app-profile-statistics [dashboard]="dashboard()"> </app-profile-statistics>
    <app-quick-actions></app-quick-actions>
  </div>
</div>
