<div class="login-page">

  <div class="islamic-pattern-overlay"></div>

  <div class="ambient-glow"></div>


  <div class="login-layout">


    <div class="login-animation-side">

      <div class="animation-lines"></div>
      <div class="animation-circle"></div>

      <div class="login-animation">

        <dotlottie-wc
          src="/Animations/st2E5s1eDr.lottie"
          autoplay
          loop>
        </dotlottie-wc>

      </div>

    </div>


    <div class="login-card check-email-card">

      <img
        src="/images/start_logo.png"
        alt="فرقان"
        class="logo-brand"
      />

      <div class="icon-box">
        <i class="bi bi-envelope-check" aria-hidden="true"></i>
      </div>

      <h1 class="login-title">
        تحقق من بريدك الإلكتروني
      </h1>

      <p class="check-email-text">
        تم إرسال رابط التفعيل إلى
        @if (userEmail) {
          <span class="check-email-address">{{ userEmail }}</span>
        } @else {
          بريدك الإلكتروني
        }
        <br />
        نحن بانتظارك لتنضم إلى رحلتك التعليمية في فرقان.
      </p>


      <button
        type="button"
        class="btn-brown mb-3"
        (click)="goToLogin()">

        العودة لتسجيل الدخول

      </button>


      <button
        type="button"
        class="check-email-resend"
        [disabled]="isResending"
        (click)="resendActivationEmail()">

        @if (isResending) {
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true">
          </span>
        }

        {{
          isResending
            ? 'جاري الإرسال...'
            : 'لم يصلك الرابط؟ إعادة إرسال'
        }}

      </button>


      @if (statusMessage) {

        <div
          class="check-email-status"
          [class.is-success]="statusMessage.includes('بنجاح')"
          role="alert">

          {{ statusMessage }}

        </div>

      }

    </div>

  </div>

</div>
