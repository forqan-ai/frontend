<main class="certificate-page" dir="rtl">
  @if (isLoading()) {
    <section class="page-state" role="status" aria-live="polite">
      <span class="spinner-border" aria-hidden="true"></span>
      <p>جارٍ تحميل الشهادة...</p>
    </section>
  } @else if (hasError()) {
    <section class="page-state error-state" role="alert">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
      <h1>تعذر تحميل الشهادة</h1>
      <p>تحقق من اتصالك ثم حاول مرة أخرى.</p>
      <button type="button" class="retry-btn" (click)="loadCertificate()">
        إعادة المحاولة
      </button>
    </section>
  } @else if (certificate(); as certificateData) {
    <div class="certificate-viewer">
      <div class="certificate-frame">
        <app-certificate-document [certificate]="certificateData" />
      </div>
    </div>

    <button
      type="button"
      class="download-btn"
      [disabled]="isDownloading()"
      [attr.aria-busy]="isDownloading()"
      (click)="downloadPdf()"
    >
      @if (isDownloading()) {
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        جارٍ إعداد الملف...
      } @else {
        <i class="bi bi-download" aria-hidden="true"></i>
        تحميل الشهادة PDF
      }
    </button>
  }
</main>
