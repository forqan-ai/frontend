<div class="dashboard-wrapper p-3 p-md-4 rounded-4" style="background-color: var(--secondary); min-height: calc(100vh - 100px); color: var(--text)">
  <div class="container d-flex align-items-center justify-content-center h-100" *ngIf="!loading">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 w-100" style="background-color: var(--surface); max-width: 800px;">
      
      <div class="text-center mb-5">
        <div class="icon-circle shadow-sm mx-auto mb-4" style="background-color: var(--primary-light); color: var(--primary); width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 2.5rem;">
          <i class="bi bi-bullseye"></i>
        </div>
        <h2 class="fw-bold mb-3" style="color: var(--primary)">اختبار تحديد المستوى</h2>
        <p class="fs-5" style="color: var(--text-muted)">
          اكتشف مستواك في العلوم الإسلامية واحصل على مسار تعلم مخصص لك خصيصاً!
        </p>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-12 col-md-4">
          <div class="card border-0 bg-transparent h-100 text-center">
            <i class="bi bi-journal-text fs-2 mb-3" style="color: var(--primary)"></i>
            <h5 class="fw-bold" style="color: var(--text)">20 سؤالاً</h5>
            <p class="small mb-0" style="color: var(--text-muted)">موزعة على المجالات الأساسية لقياس فهمك</p>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card border-0 bg-transparent h-100 text-center">
            <i class="bi bi-cpu fs-2 mb-3" style="color: var(--primary)"></i>
            <h5 class="fw-bold" style="color: var(--text)">تحليل دقيق</h5>
            <p class="small mb-0" style="color: var(--text-muted)">نظام ذكي يبني لك مساراً يتوافق مع مستواك</p>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card border-0 bg-transparent h-100 text-center">
            <i class="bi bi-graph-up-arrow fs-2 mb-3" style="color: var(--primary)"></i>
            <h5 class="fw-bold" style="color: var(--text)">تقرير شامل</h5>
            <p class="small mb-0" style="color: var(--text-muted)">تقييم مفصل لكل مجال من المجالات الشرعية</p>
          </div>
        </div>
      </div>

      <div class="text-center" *ngIf="!hasTaken">
        <button class="btn px-5 py-3 rounded-pill fw-bold fs-5 shadow-sm" 
                style="background-color: var(--primary); color: white; transition: all 0.3s;"
                onmouseover="this.style.opacity='0.9'; this.style.transform='translateY(-2px)';"
                onmouseout="this.style.opacity='1'; this.style.transform='translateY(0)';"
                (click)="startTest()">
          ابدأ الاختبار الآن <i class="bi bi-arrow-left ms-2"></i>
        </button>
      </div>

      <div class="text-center" *ngIf="hasTaken">
        <div class="alert alert-success d-inline-flex align-items-center mb-4 rounded-3" style="background-color: var(--primary-light); color: var(--primary); border: none;">
          <i class="bi bi-check-circle-fill me-2 fs-5"></i>
          <span class="fw-semibold">لقد أجريت الاختبار مسبقاً بنجاح</span>
        </div>
        <div class="d-flex justify-content-center gap-3">
          <button class="btn px-4 py-2 rounded-3 fw-bold" 
                  style="background-color: var(--primary); color: white;" 
                  (click)="viewResult()">
            <i class="bi bi-bar-chart-fill me-2"></i>عرض نتائجي
          </button>
          <button class="btn px-4 py-2 rounded-3 fw-bold" 
                  style="border: 2px solid var(--primary); color: var(--primary); background: transparent;" 
                  (click)="startTest()"
                  onmouseover="this.style.backgroundColor='var(--primary)'; this.style.color='white';"
                  onmouseout="this.style.backgroundColor='transparent'; this.style.color='var(--primary)';">
            <i class="bi bi-arrow-clockwise me-2"></i>إعادة الاختبار
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-center h-100" *ngIf="loading" style="min-height: 50vh;">
    <div class="spinner-border" style="color: var(--primary); width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>
