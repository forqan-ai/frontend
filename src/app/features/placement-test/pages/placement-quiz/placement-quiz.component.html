<div class="dashboard-wrapper p-3 p-md-4 rounded-4" style="background-color: var(--secondary); min-height: calc(100vh - 100px); color: var(--text)">
  
  <div class="container py-4 h-100" *ngIf="!loading">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        

        <div class="card border-0 shadow-sm rounded-4 mb-4 p-3" style="background-color: var(--surface);">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-bold fs-5" style="color: var(--primary);">السؤال {{ currentIndex + 1 }} من {{ questions.length }}</span>
            <span class="badge rounded-pill fs-6 px-3 py-2" style="background-color: var(--primary-light); color: var(--primary);">
              {{ currentQuestion?.categoryName }}
            </span>
          </div>
          <div class="progress" style="height: 10px; background-color: var(--secondary);">
            <div class="progress-bar rounded-pill" role="progressbar" 
                 [style.width.%]="progress" 
                 style="background-color: var(--primary); transition: width 0.3s ease;">
            </div>
          </div>
        </div>


        <div class="card border-0 shadow-sm rounded-4 mb-4 p-4 p-md-5" style="background-color: var(--surface);" *ngIf="currentQuestion">
          <h3 class="fw-bold mb-4" style="color: var(--text); line-height: 1.6;">{{ currentQuestion.text }}</h3>

          <div class="d-flex flex-column gap-3">
            <button
              *ngFor="let option of currentQuestion.options"
              class="btn text-start p-3 rounded-3 d-flex justify-content-between align-items-center fw-semibold fs-5"
              [ngStyle]="{
                'background-color': selectedOption === option.optionID ? 'var(--primary-light)' : 'var(--secondary)',
                'border': selectedOption === option.optionID ? '2px solid var(--primary)' : '2px solid transparent',
                'color': selectedOption === option.optionID ? 'var(--primary)' : 'var(--text)'
              }"
              style="transition: all 0.2s;"
              onmouseover="if(this.style.borderColor === 'transparent') { this.style.backgroundColor = '#eef2f6'; }"
              onmouseout="if(this.style.borderColor === 'transparent') { this.style.backgroundColor = 'var(--secondary)'; }"
              (click)="selectOption(option.optionID)">
              <span>{{ option.optionText }}</span>
              <i class="bi bi-check-circle-fill fs-4" *ngIf="selectedOption === option.optionID"></i>
            </button>
          </div>
        </div>


        <div class="d-flex justify-content-between align-items-center">
          <button class="btn px-4 py-2 rounded-3 fw-bold shadow-sm" 
                  style="background-color: var(--surface); color: var(--text-muted); border: 1px solid var(--border);"
                  (click)="prev()" [disabled]="currentIndex === 0">
            <i class="bi bi-arrow-right me-2"></i>السابق
          </button>

          <button
            *ngIf="currentIndex < questions.length - 1"
            class="btn px-4 py-2 rounded-3 fw-bold shadow-sm"
            [ngStyle]="{'background-color': isAnswered ? 'var(--primary)' : 'var(--secondary)', 'color': isAnswered ? 'white' : 'var(--text-muted)'}"
            (click)="next()"
            [disabled]="!isAnswered">
            التالي <i class="bi bi-arrow-left ms-2"></i>
          </button>

          <button
            *ngIf="currentIndex === questions.length - 1"
            class="btn px-5 py-2 rounded-3 fw-bold shadow-sm"
            [ngStyle]="{'background-color': isAnswered && !submitting ? 'var(--primary)' : 'var(--secondary)', 'color': isAnswered && !submitting ? 'white' : 'var(--text-muted)'}"
            (click)="submit()"
            [disabled]="!isAnswered || submitting">
            <span *ngIf="submitting">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              جارٍ الإرسال...
            </span>
            <span *ngIf="!submitting">إنهاء الاختبار <i class="bi bi-flag-fill ms-2"></i></span>
          </button>
        </div>

        <div class="alert alert-danger mt-4" *ngIf="error">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-center h-100" *ngIf="loading" style="min-height: 50vh;">
    <div class="text-center">
      <div class="spinner-border mb-3" style="color: var(--primary); width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h5 style="color: var(--text-muted);">جارٍ تحميل الاختبار...</h5>
    </div>
  </div>
</div>
