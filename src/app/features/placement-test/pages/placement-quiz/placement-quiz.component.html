<div class="quiz-wrapper p-3 p-md-4">

  <div class="container py-4" *ngIf="!loading">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

        <div class="progress-card mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <span class="question-counter">السؤال {{ currentIndex + 1 }} من {{ questions.length }}</span>
            <span class="category-pill">{{ currentQuestion?.categoryName }}</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" [style.width.%]="progress"></div>
          </div>
        </div>

        <div class="question-card mb-4" *ngIf="currentQuestion">
          <p class="question-text">{{ currentQuestion.text }}</p>
          <div class="d-flex flex-column gap-3">
            <button
              *ngFor="let option of currentQuestion.options"
              class="option-btn"
              [class.selected]="selectedOption === option.optionID"
              (click)="selectOption(option.optionID)">
              <span>{{ option.optionText }}</span>
              <i class="bi bi-check-circle-fill check-icon" *ngIf="selectedOption === option.optionID"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center nav-row">
          <button class="btn-nav-prev" (click)="prev()" [disabled]="currentIndex === 0">
            <i class="bi bi-arrow-right me-2"></i>السابق
          </button>

          <button
            *ngIf="currentIndex < questions.length - 1"
            class="btn-nav-next"
            [class.active]="isAnswered"
            [class.inactive]="!isAnswered"
            (click)="next()"
            [disabled]="!isAnswered">
            التالي <i class="bi bi-arrow-left ms-2"></i>
          </button>

          <button
            *ngIf="currentIndex === questions.length - 1"
            class="btn-submit"
            [class.active]="isAnswered && !submitting"
            [class.inactive]="!isAnswered || submitting"
            (click)="submit()"
            [disabled]="!isAnswered || submitting">
            <span *ngIf="submitting">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              جارٍ الإرسال...
            </span>
            <span *ngIf="!submitting">إنهاء الاختبار <i class="bi bi-flag-fill ms-2"></i></span>
          </button>
        </div>

        <div class="error-alert" *ngIf="error">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-center" *ngIf="loading" style="min-height: 60vh;">
    <div class="text-center">
      <div class="spinner-border mb-3" style="color: var(--primary); width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h5 style="color: var(--text-muted);">جارٍ تحميل الاختبار...</h5>
    </div>
  </div>
</div>
