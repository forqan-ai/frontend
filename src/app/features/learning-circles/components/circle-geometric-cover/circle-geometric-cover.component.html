
<div
  class="geometric-cover"
  [class.compact]="compact()"
  [attr.data-variant]="variant()"
  role="img"
  [attr.aria-label]="'غلاف هندسي لحلقة ' + circleName()"
>
  <div
    class="cover-orb orb-one"
    aria-hidden="true"
  ></div>

  <div
    class="cover-orb orb-two"
    aria-hidden="true"
  ></div>

  <div
    class="soft-ring ring-one"
    aria-hidden="true"
  ></div>

  <div
    class="soft-ring ring-two"
    aria-hidden="true"
  ></div>

  <div
    class="soft-ring ring-three"
    aria-hidden="true"
  ></div>

  <div
    class="diagonal-lines"
    aria-hidden="true"
  ></div>

  <div
    class="center-shape"
    aria-hidden="true"
  >
    <span class="center-dot"></span>
  </div>

  <span
    class="small-shape small-shape-one"
    aria-hidden="true"
  ></span>

  <span
    class="small-shape small-shape-two"
    aria-hidden="true"
  ></span>

  <span
    class="small-shape small-shape-three"
    aria-hidden="true"
  ></span>

  <div
    class="light-sweep"
    aria-hidden="true"
  ></div>

  <div
    class="cover-grain"
    aria-hidden="true"
  ></div>
</div>
