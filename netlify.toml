[build]
  command = "npm run build"
  publish = "dist/Forqan/browser"

[build.environment]
  NETLIFY_SKIP_ANGULAR_RUNTIME = "true"

# Proxy API calls to backend (server-side - no CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://forqan-api.runasp.net/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# Proxy hubs (SignalR)
[[redirects]]
  from = "/hubs/*"
  to = "https://forqan-api.runasp.net/hubs/:splat"
  status = 200
  force = true

# Angular SPA routing - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
